[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ec-cv-research"
version = "0.1.0"
description = "Adaptive scheduling and asynchronous tracking on edge hardware"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "numpy>=1.26,<3", "opencv-python-headless>=4.9,<5",
  "onnxruntime>=1.18,<2", "scipy>=1.12,<2", "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "mypy>=1.15,<2", "ruff>=0.11,<1", "types-psutil", "scipy-stubs", "onnx>=1.17,<2"]
eval = ["opencv-python>=4.11,<5", "trackeval==1.3.0", "matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.setuptools.package-data]
src = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["onnxruntime"]
ignore_missing_imports = true
