name: Python quality
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install editable package and test dependencies
        run: |
          python -m pip install -e '.[dev,eval]'
          python -m pip check
          python -c 'import os, sys; from pathlib import Path; Path(os.environ["GITHUB_ENV"]).open("a").write(f"EVAL_PYTHON={sys.executable}\n")'
      - name: Record Python and resolved dependency versions
        run: |
          python -VV
          python -m pip list
      - name: Lint and strict type checks
        run: make lint
      - name: Full Python suite
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: make test
